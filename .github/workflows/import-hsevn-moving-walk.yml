name: Import HSEVN FUJIVISTA moving walk photos
on:
  push:
    paths:
      - '.github/workflows/import-hsevn-moving-walk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified moving walk source photos and convert to JPG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p assets/email
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from PIL import Image
          from io import BytesIO
          from pathlib import Path
          urls=[
            "https://image.made-in-china.com/202f0j00SyWiVdjlyhkg/High-Quality-0-to-12-Degree-Horizontal-Moving-Walk-Escalator.webp",
            "https://image.made-in-china.com/202f0j00FNWlifZKlhcg/High-Quality-0-to-12-Degree-Horizontal-Moving-Walk-Escalator.webp",
            "https://image.made-in-china.com/202f0j00FyVlhHKqlWog/High-Quality-0-to-12-Degree-Horizontal-Moving-Walk-Escalator.webp"
          ]
          for i,url in enumerate(urls,1):
              req=Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; AIG-HSEVN-ImageVerifier/1.0)","Referer":"https://demanelevator888.en.made-in-china.com/"})
              with urlopen(req, timeout=40) as response:
                  data=response.read()
              im=Image.open(BytesIO(data))
              im.load()
              if im.width<300 or im.height<250:
                  raise RuntimeError(f"Image {i} suspiciously small: {im.size}")
              im.convert("RGB").save(Path("assets/email")/f"fujivista-moving-walk-source-{i:02d}.jpg", "JPEG",quality=88,optimize=True)
              print(f"Photo {i}: {im.size} / {len(data)} bytes downloaded")
          PY
      - name: Publish checked JPEG images
        run: |
          git config user.name "AIG HSEVN Image Publisher"
          git config user.email "aig-hsevn-images@users.noreply.github.com"
          git add assets/email/fujivista-moving-walk-source-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publish correct FUJIVISTA Moving Walk product images as JPEG"
            git push
          fi
